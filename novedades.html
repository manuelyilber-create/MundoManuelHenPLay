<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novedades - MundoManuelHenPlay</title>
  <style>
    /* ESTILOS Y TEMA GLOBAL */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #0d0f12 url('V2/fondo.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
    }

    header {
      width: 100%;
      background: rgba(0, 0, 0, 0.85);
      border-bottom: 2px solid #0070d1;
    }

    .banner {
      width: 100%;
      max-height: 180px;
      object-fit: cover;
      display: block;
    }

    nav {
      background: #161920;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      flex-wrap: wrap;
    }

    .nav-links {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      gap: 15px;
    }

    .nav-links a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 15px;
      display: block;
      border-radius: 4px;
    }

    .nav-links a:hover, .nav-links a.active {
      background: #0070d1;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .counter-badge {
      background: #1f232d;
      border: 1px solid #0070d1;
      border-radius: 15px;
      padding: 5px 12px;
      font-size: 13px;
      color: #00a2ff;
      font-weight: bold;
    }

    .btn-admin {
      background: #0070d1;
      color: #ffffff;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    /* CONTENEDOR PRINCIPAL */
    main {
      padding: 25px;
      max-width: 900px;
      margin: 20px auto;
      background: rgba(15, 18, 24, 0.9);
      border-radius: 8px;
    }

    .news-card {
      background: #1f232d;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 15px;
      display: flex;
      gap: 15px;
      border-left: 4px solid #00a2ff;
    }

    .news-img {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #0070d1;
      background: #000;
    }

    /* PANEL ADMIN PARA NOVEDADES */
    #adminNewsPanel {
      display: none;
      background: #1a1e27;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 25px;
      border: 2px dashed #00a2ff;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #00a2ff;
      font-size: 14px;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      background: #161920;
      border: 1px solid #3a4150;
      color: #fff;
      border-radius: 4px;
    }

    /* MODAL LOGIN */
    #loginModal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }

    .modal-box {
      background: #1f232d;
      padding: 25px;
      border-radius: 8px;
      width: 300px;
      text-align: center;
      border: 2px solid #0070d1;
    }
  </style>
</head>
<body>

  <header>
    <img src="V2/banner.png" alt="Banner MundoManuelHenPlay" class="banner" onerror="this.style.display='none'">
    
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">🎮 Juegos y Tienda (Principal)</a></li>
        <li><a href="novedades.html" class="active">📢 Novedades y Anuncios</a></li>
      </ul>

      <div class="header-right">
        <div class="counter-badge">👥 Visitas: <span id="cntVisitas">0</span></div>
        <button class="btn-admin" id="btnAdminNav" onclick="mostrarLogin()">🔒 Admin Novedades</button>
      </div>
    </nav>
  </header>

  <main>
    <h2>📢 Seccion de Novedades y Anuncios</h2>

    <section id="adminNewsPanel">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3 style="margin: 0; color: #00a2ff;">Panel de Publicación de Noticias</h3>
        <button onclick="cerrarSesion()" style="background:#dc3545; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">Cerrar Sesión</button>
      </div>

      <div class="form-group">
        <label>Título de la Noticia:</label>
        <input type="text" id="newsTitle" placeholder="Ej: ¡Nuevo Mod Hen Lanzado!">
      </div>
      <div class="form-group">
        <label>Ruta o URL de Imagen:</label>
        <input type="text" id="newsImg" placeholder="Ej: V2/banner.png o enlace https://...">
      </div>
      <div class="form-group">
        <label>Contenido del Anuncio:</label>
        <textarea id="newsContent" rows="4" placeholder="Escribe aquí los detalles del anuncio..."></textarea>
      </div>
      <button onclick="guardarNoticia()" style="background:#28a745; color:#fff; border:none; padding:10px; width:100%; font-weight:bold; cursor:pointer; border-radius:4px;">📢 Publicar Noticia</button>
    </section>

    <div id="contenedorNoticias"></div>
  </main>

  <div id="loginModal">
    <div class="modal-box">
      <h3 style="color:#00a2ff; margin-top:0;">Acceso Admin Noticias</h3>
      <input type="text" id="userInput" placeholder="Usuario" style="width:100%; margin-bottom:10px; padding:8px; box-sizing:border-box; background:#161920; border:1px solid #3a4150; color:#fff; border-radius:4px;">
      <input type="password" id="passInput" placeholder="Contraseña" style="width:100%; margin-bottom:15px; padding:8px; box-sizing:border-box; background:#161920; border:1px solid #3a4150; color:#fff; border-radius:4px;">
      <button onclick="validarAdmin()" style="background:#0070d1; color:#fff; border:none; padding:8px 15px; cursor:pointer; border-radius:4px; font-weight:bold;">Entrar</button>
      <button onclick="ocultarLogin()" style="background:#dc3545; color:#fff; border:none; padding:8px 15px; cursor:pointer; border-radius:4px; margin-left:5px;">Cancelar</button>
    </div>
  </div>

  <script>
    let noticias = JSON.parse(localStorage.getItem('mmhp_noticias_solas')) || [
      {
        id: 1,
        titulo: "¡Bienvenido a la Sección de Novedades!",
        fecha: new Date().toLocaleDateString(),
        imagen: "V2/banner.png",
        contenido: "Esta es tu nueva sección independiente de noticias. Desde aquí podrás publicar avisos para tus usuarios sin interferir con la página principal."
      }
    ];

    let visitas = parseInt(localStorage.getItem('mmhp_visitas_noticias') || "0") + 1;
    localStorage.setItem('mmhp_visitas_noticias', visitas);

    let esAdmin = false;

    window.onload = function() {
      document.getElementById('cntVisitas').innerText = visitas;
      renderizarNoticias();
    };

    function mostrarLogin() {
      document.getElementById('loginModal').style.display = 'flex';
    }

    function ocultarLogin() {
      document.getElementById('loginModal').style.display = 'none';
      document.getElementById('userInput').value = '';
      document.getElementById('passInput').value = '';
    }

    function validarAdmin() {
      let u = document.getElementById('userInput').value.trim();
      let p = document.getElementById('passInput').value.trim();

      if (u === "admin" && p === "1234") {
        esAdmin = true;
        document.getElementById('adminNewsPanel').style.display = 'block';
        document.getElementById('btnAdminNav').style.display = 'none';
        ocultarLogin();
        renderizarNoticias();
      } else {
        alert("Datos incorrectos.");
      }
    }

    function cerrarSesion() {
      esAdmin = false;
      document.getElementById('adminNewsPanel').style.display = 'none';
      document.getElementById('btnAdminNav').style.display = 'inline-block';
      renderizarNoticias();
    }

    function guardarNoticia() {
      let tit = document.getElementById('newsTitle').value.trim();
      let img = document.getElementById('newsImg').value.trim() || 'V2/banner.png';
      let cont = document.getElementById('newsContent').value.trim();

      if (tit && cont) {
        noticias.unshift({
          id: Date.now(),
          titulo: tit,
          fecha: new Date().toLocaleDateString(),
          imagen: img,
          contenido: cont
        });
        localStorage.setItem('mmhp_noticias_solas', JSON.stringify(noticias));
        renderizarNoticias();

        document.getElementById('newsTitle').value = '';
        document.getElementById('newsImg').value = '';
        document.getElementById('newsContent').value = '';
        alert("Noticia publicada exitosamente.");
      } else {
        alert("Rellena el Título y el Contenido.");
      }
    }

    function borrarNoticia(id) {
      noticias = noticias.filter(n => n.id !== id);
      localStorage.setItem('mmhp_noticias_solas', JSON.stringify(noticias));
      renderizarNoticias();
    }

    function renderizarNoticias() {
      let c = document.getElementById('contenedorNoticias');
      c.innerHTML = '';

      noticias.forEach(n => {
        let btnBorrar = esAdmin ? `<button onclick="borrarNoticia(${n.id})" style="background:#dc3545; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:12px; margin-top:8px;">🗑️ Eliminar</button>` : '';

        c.innerHTML += `
          <div class="news-card">
            <img src="${n.imagen}" class="news-img" onerror="this.src='V2/banner.png'">
            <div>
              <h3 style="margin:0 0 5px 0; color:#00a2ff;">${n.titulo}</h3>
              <small style="color:#aaa;">📅 Fecha: ${n.fecha}</small>
              <p style="margin:8px 0 0 0; color:#ccc; line-height:1.4;">${n.contenido}</p>
              ${btnBorrar}
            </div>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
