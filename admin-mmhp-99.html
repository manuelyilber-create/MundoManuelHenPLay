<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Privado Admin | MundoManuelHenPlay</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #0d0f12;
      color: #ffffff;
    }

    /* PANTALLA DE ACCESO/LOGIN INICIAL */
    #lockScreen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #0d0f12;
    }

    .login-box {
      background: #1f232d;
      padding: 30px;
      border-radius: 8px;
      width: 320px;
      text-align: center;
      border: 2px solid #0070d1;
      box-shadow: 0 0 20px rgba(0, 112, 209, 0.4);
    }

    .login-box input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      box-sizing: border-box;
      background: #161920;
      border: 1px solid #3a4150;
      color: #fff;
      border-radius: 4px;
    }

    .login-box button {
      background: #0070d1;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }

    /* CONTENEDOR DEL PANEL PRIVADO */
    #adminContent {
      display: none;
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
    }

    #adminPanel {
      background: #252a36;
      padding: 20px;
      border-radius: 8px;
      border: 2px solid #0070d1;
    }

    .admin-subpanel {
      background: #1a1e27;
      padding: 15px;
      border-radius: 6px;
      margin-top: 15px;
      border: 1px dashed #00a2ff;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #00a2ff;
      font-size: 14px;
    }

    .form-group input[type="text"], 
    .form-group select, 
    .form-group textarea,
    .form-group input[type="file"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      background: #161920;
      border: 1px solid #3a4150;
      color: #fff;
      border-radius: 4px;
    }

    .sub-option-box {
      background: #12151c;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #2a2f3d;
      margin-top: 5px;
    }

    .item-list-row {
      background: #161920;
      padding: 10px;
      margin-top: 8px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 3px solid #0070d1;
    }

    .btn-delete {
      background: #dc3545;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- PANTALLA DE DESBLOQUEO -->
  <div id="lockScreen">
    <div class="login-box">
      <h3 style="margin-top:0; color:#00a2ff;">🔒 Acceso Exclusivo Admin</h3>
      <input type="text" id="userInput" placeholder="Usuario">
      <input type="password" id="passInput" placeholder="Contraseña">
      <button onclick="validarAcceso()">Ingresar al Panel</button>
    </div>
  </div>

  <!-- PANEL DE ADMINISTRACIÓN -->
  <div id="adminContent">
    <div id="adminPanel">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3a4150; padding-bottom: 10px;">
        <h3 style="margin: 0; color: #00a2ff;">Panel Privado de Control General</h3>
        <div>
          <a href="index.html" style="background:#0070d1; color:#fff; text-decoration:none; padding:6px 12px; border-radius:4px; margin-right:8px; font-size:14px;">🌐 Ver Sitio Web</a>
          <button onclick="cerrarSesion()" style="background:#dc3545; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">🚪 Salir</button>
        </div>
      </div>

      <!-- 1. AGREGAR APLICACIÓN -->
      <div class="admin-subpanel">
        <h4 style="margin-top:0; color:#28a745;">📦 1. Agregar Nueva Aplicación / Archivo</h4>
        
        <div class="form-group">
          <label>Nombre y Versión:</label>
          <input type="text" id="appName" placeholder="Ej: HEN 4.93 Installer v1.0">
        </div>

        <div class="form-group">
          <label>Categoría:</label>
          <select id="appCategory">
            <option value="PS2">PS2</option>
            <option value="PS3">PS3</option>
            <option value="PS4">PS4</option>
            <option value="Herramientas">Herramientas</option>
            <option value="Utilidades">Utilidades</option>
            <option value="Android">Android</option>
          </select>
        </div>

        <!-- 3 OPCIONES PARA EL LOGO -->
        <div class="form-group">
          <label>Método para el Logo/Imagen:</label>
          <select id="logoMethod" onchange="cambiarMetodoLogo()">
            <option value="v2">📁 Ruta local de la carpeta V2 (Ej: V2/apps.png)</option>
            <option value="url">🌐 Enlace Web / URL externa (Ej: https://...)</option>
            <option value="file">💻 Subir archivo desde Escritorio</option>
          </select>
          
          <div class="sub-option-box">
            <div id="optV2">
              <input type="text" id="appLogoV2" placeholder="Ej: V2/apps.png o V2/mi-logo.png">
            </div>
            <div id="optUrl" style="display:none;">
              <input type="text" id="appLogoUrl" placeholder="Ej: https://sitio.com/imagen.png">
            </div>
            <div id="optFile" style="display:none;">
              <input type="file" id="appLogoFile" accept="image/*">
            </div>
          </div>
        </div>

        <!-- URL/RUTA DE DESCARGA -->
        <div class="form-group">
          <label>Ruta o Link de Descarga (URL/Servidor local):</label>
          <input type="text" id="appLink" placeholder="Ej: Ps3/Hen/4.93/SETUP.P3T o https://megaupload.com/archivo">
        </div>

        <button onclick="agregarItem()" style="background:#28a745; color:#fff; border:none; padding:10px; width:100%; border-radius:4px; font-weight:bold; cursor:pointer;">＋ Publicar Aplicación</button>
      </div>

      <!-- 2. AGREGAR NOVEDAD -->
      <div class="admin-subpanel">
        <h4 style="margin-top:0; color:#00a2ff;">📢 2. Publicar Novedad o Noticia</h4>
        <div class="form-group">
          <label>Título de la Novedad:</label>
          <input type="text" id="newsTitleInput" placeholder="Ej: ¡Actualización HEN 4.93 disponible!">
        </div>
        <div class="form-group">
          <label>Imagen del Anuncio (Ruta V2 o URL web):</label>
          <input type="text" id="newsImgInput" placeholder="Ej: V2/banner.png o https://...">
        </div>
        <div class="form-group">
          <label>Descripción / Detalle del Anuncio:</label>
          <textarea id="newsDescInput" rows="3" placeholder="Escribe la información aquí..."></textarea>
        </div>
        <button onclick="agregarNovedad()" style="background:#0070d1; color:#fff; border:none; padding:10px; width:100%; border-radius:4px; font-weight:bold; cursor:pointer;">📢 Publicar Novedad</button>
      </div>

      <!-- 3. LISTAS DE GESTIÓN -->
      <div class="admin-subpanel">
        <h4 style="margin-top:0; color:#ffc107;">🗑️ 3. Administrar Aplicaciones Publicadas</h4>
        <div id="adminAppsList"></div>
      </div>

      <div class="admin-subpanel">
        <h4 style="margin-top:0; color:#ffc107;">🗑️ 4. Administrar Noticias Publicadas</h4>
        <div id="adminNewsList"></div>
      </div>
    </div>
  </div>

  <!-- SDKs de Firebase Firestore -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    // CONFIGURACIÓN DE FIREBASE (Usa exactamente la misma que en tu index.html)
    const firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "TU_AUTH_DOMAIN",
      projectId: "TU_PROJECT_ID",
      storageBucket: "TU_STORAGE_BUCKET",
      messagingSenderId: "TU_MESSAGING_SENDER_ID",
      appId: "TU_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function calcularSHA256(texto) {
      const encoder = new TextEncoder();
      const data = encoder.encode(texto);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function validarAcceso() {
      let u = document.getElementById('userInput').value.trim();
      let p = document.getElementById('passInput').value.trim();

      const hashGuardado = "03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4"; // Contraseña: 1234
      let hashIngresado = await calcularSHA256(p);

      if (u === "admin" && hashIngresado === hashGuardado) {
        document.getElementById('lockScreen').style.display = 'none';
        document.getElementById('adminContent').style.display = 'block';
        cargarListasAdminEnTiempoReal();
      } else {
        alert("Credenciales incorrectas.");
      }
    }

    function cerrarSesion() {
      location.reload();
    }

    function cambiarMetodoLogo() {
      let metodo = document.getElementById('logoMethod').value;
      document.getElementById('optV2').style.display = (metodo === 'v2') ? 'block' : 'none';
      document.getElementById('optUrl').style.display = (metodo === 'url') ? 'block' : 'none';
      document.getElementById('optFile').style.display = (metodo === 'file') ? 'block' : 'none';
    }

    function leerArchivoComoDataURL(fileInput) {
      return new Promise((resolve, reject) => {
        const file = fileInput.files[0];
        if (!file) { resolve(null); return; }
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = (error) => reject(error);
        reader.readAsDataURL(file);
      });
    }

    async function agregarItem() {
      let name = document.getElementById('appName').value.trim();
      let category = document.getElementById('appCategory').value;
      let link = document.getElementById('appLink').value.trim();
      let metodo = document.getElementById('logoMethod').value;
      let logoFinal = 'V2/apps.png';

      if (!name || !link) {
        alert("Ingresa el Nombre y el Enlace/URL de descarga.");
        return;
      }

      if (metodo === 'v2') {
        let v2Val = document.getElementById('appLogoV2').value.trim();
        if (v2Val) logoFinal = v2Val;
      } else if (metodo === 'url') {
        let urlVal = document.getElementById('appLogoUrl').value.trim();
        if (urlVal) logoFinal = urlVal;
      } else if (metodo === 'file') {
        let fileInput = document.getElementById('appLogoFile');
        let fileData = await leerArchivoComoDataURL(fileInput);
        if (fileData) logoFinal = fileData;
      }

      try {
        await db.collection("aplicaciones").add({
          nombre: name,
          categoria: category,
          logo: logoFinal,
          enlace: link,
          creado: firebase.firestore.FieldValue.serverTimestamp()
        });

        alert("Aplicación publicada con éxito en Firestore.");
        document.getElementById('appName').value = '';
        document.getElementById('appLink').value = '';
        document.getElementById('appLogoV2').value = '';
        document.getElementById('appLogoUrl').value = '';
        document.getElementById('appLogoFile').value = '';
      } catch (e) {
        console.error("Error al guardar aplicación: ", e);
        alert("Error al publicar la aplicación.");
      }
    }

    async function agregarNovedad() {
      let title = document.getElementById('newsTitleInput').value.trim();
      let img = document.getElementById('newsImgInput').value.trim() || 'V2/banner.png';
      let desc = document.getElementById('newsDescInput').value.trim();

      if(title && desc) {
        try {
          await db.collection("noticias").add({
            titulo: title,
            fecha: new Date().toLocaleDateString(),
            imagen: img,
            descripcion: desc,
            creado: firebase.firestore.FieldValue.serverTimestamp()
          });

          alert("Novedad publicada con éxito en Firestore.");
          document.getElementById('newsTitleInput').value = '';
          document.getElementById('newsImgInput').value = '';
          document.getElementById('newsDescInput').value = '';
        } catch (e) {
          console.error("Error al guardar novedad: ", e);
          alert("Error al publicar la novedad.");
        }
      } else {
        alert("Ingresa el Título y la Descripción.");
      }
    }

    async function eliminarItem(id) {
      if(confirm("¿Estás seguro de borrar esta aplicación?")) {
        try {
          await db.collection("aplicaciones").doc(id).delete();
        } catch (e) {
          console.error("Error al borrar: ", e);
        }
      }
    }

    async function eliminarNovedad(id) {
      if(confirm("¿Estás seguro de borrar esta novedad?")) {
        try {
          await db.collection("noticias").doc(id).delete();
        } catch (e) {
          console.error("Error al borrar: ", e);
        }
      }
    }

    function cargarListasAdminEnTiempoReal() {
      // Listado de Aplicaciones en tiempo real dentro del panel
      db.collection("aplicaciones").onSnapshot((snapshot) => {
        let appContainer = document.getElementById('adminAppsList');
        appContainer.innerHTML = '';
        if(snapshot.empty) {
          appContainer.innerHTML = '<small style="color:#aaa;">No hay aplicaciones.</small>';
          return;
        }
        snapshot.forEach((doc) => {
          let app = doc.data();
          appContainer.innerHTML += `
            <div class="item-list-row">
              <span>[${app.categoria}] <strong>${app.nombre}</strong></span>
              <button class="btn-delete" onclick="eliminarItem('${doc.id}')">🗑️ Borrar</button>
            </div>`;
        });
      });

      // Listado de Noticias en tiempo real dentro del panel
      db.collection("noticias").onSnapshot((snapshot) => {
        let newsContainer = document.getElementById('adminNewsList');
        newsContainer.innerHTML = '';
        if(snapshot.empty) {
          newsContainer.innerHTML = '<small style="color:#aaa;">No hay novedades.</small>';
          return;
        }
        snapshot.forEach((doc) => {
          let n = doc.data();
          newsContainer.innerHTML += `
            <div class="item-list-row">
              <span><strong>${n.titulo}</strong> (${n.fecha})</span>
              <button class="btn-delete" onclick="eliminarNovedad('${doc.id}')">🗑️ Borrar</button>
            </div>`;
        });
      });
    }
  </script>
</body>
</html>
