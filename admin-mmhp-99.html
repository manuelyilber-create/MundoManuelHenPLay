<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Privado de Control General | MundoManuelHenPlay</title>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCv-qeex1pBV7pfi2UD0iUio46-OX2MCiI",
      authDomain: "mundomanuelhenplay.firebaseapp.com",
      projectId: "mundomanuelhenplay",
      storageBucket: "mundomanuelhenplay.firebasestorage.app",
      messagingSenderId: "1072751644369",
      appId: "1:1072751644369:web:9ce6b8ad4b115b2e643ff0",
      measurementId: "G-QZ4RSWGEJL"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    window.db = db;
    window.storage = storage;
    window.ref = ref;
    window.uploadBytes = uploadBytes;
    window.getDownloadURL = getDownloadURL;
    window.colApps = collection(db, "apps");
    window.colNews = collection(db, "news");
    window.colComments = collection(db, "comments");
  </script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; font-family: Arial, sans-serif; background: #0d0f12; color: #ffffff; }
    #lockScreen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; padding: 15px; }
    .login-box { background: #1f232d; padding: 25px; border-radius: 8px; width: 100%; max-width: 320px; text-align: center; border: 2px solid #0070d1; }
    .login-box input { width: 100%; padding: 10px; margin-bottom: 12px; background: #161920; border: 1px solid #3a4150; color: #fff; border-radius: 4px; }
    .login-box button { background: #0070d1; color: #fff; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; }
    #adminContent { display: none; max-width: 900px; margin: 20px auto; padding: 15px; }
    #adminPanel { background: #161b22; padding: 20px; border-radius: 8px; border: 2px solid #0070d1; }
    .admin-subpanel { background: #1f242d; padding: 15px; border-radius: 6px; margin-top: 20px; border: 1px dashed #0070d1; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 6px; color: #00a2ff; font-size: 13px; font-weight: bold; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 9px; background: #0d0f12; border: 1px solid #3a4150; color: #fff; border-radius: 4px; }
    .item-list-row { background: #0d0f12; padding: 10px; margin-top: 8px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid #0070d1; flex-wrap: wrap; gap: 10px; }
    .btn-delete { background: #dc3545; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    .upload-status { font-size: 12px; color: #f1c40f; margin-top: 4px; display: block; }
  </style>
</head>
<body>

  <div id="lockScreen">
    <div class="login-box">
      <h3 style="margin-top:0; color:#00a2ff;">🔒 Acceso Admin Cloud</h3>
      <input type="text" id="userInput" placeholder="Usuario">
      <input type="password" id="passInput" placeholder="Contraseña">
      <button onclick="validarAcceso()">Ingresar al Panel</button>
    </div>
  </div>

  <div id="adminContent">
    <div id="adminPanel">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3a4150; padding-bottom: 12px;">
        <h2 style="margin: 0; color: #fff; font-size: 18px;">Panel Privado de Control General</h2>
        <div>
          <a href="index.html" style="background:#0070d1; color:#fff; text-decoration:none; padding:6px 12px; border-radius:4px; font-size:13px; margin-right: 5px;">🌐 Ver Sitio Web</a>
          <button onclick="location.reload()" style="background:#dc3545; color:#fff; border:none; padding:6px 12px; border-radius:4px; font-size:13px; cursor:pointer;">🚪 Salir</button>
        </div>
      </div>

      <!-- 1. AGREGAR APLICACIÓN -->
      <div class="admin-subpanel">
        <h3 style="margin-top:0; color:#28a745; font-size: 15px;">📦 1. Agregar Nueva Aplicación / Archivo</h3>
        
        <div class="form-group">
          <label>Nombre y Versión:</label>
          <input type="text" id="appName" placeholder="Ej: HEN 4.93 Installer v1.0">
        </div>

        <div class="form-group">
          <label>Categoría:</label>
          <select id="appCategory">
            <option value="PS2">PS2</option>
            <option value="PS3">PS3</option>
            <option value="PS4">PS4</option>
            <option value="Aplicaciones">Aplicaciones</option>
            <option value="Utilidades">Utilidades</option>
            <option value="Android">Android</option>
          </select>
        </div>

        <!-- Método para el Logo -->
        <div class="form-group">
          <label>Método para el Logo/Imagen:</label>
          <select id="logoMethod" onchange="cambiarMetodoLogo()">
            <option value="v2">📁 Ruta local de la carpeta V2 (Ej: V2/apps.png)</option>
            <option value="web">🌐 Enlace Web / URL externa (Ej: https://...)</option>
            <option value="desktop">💻 Subir archivo desde Escritorio</option>
          </select>
        </div>
        <div class="form-group" id="logoInputContainer">
          <input type="text" id="appLogoValue" placeholder="Ej: V2/apps.png o V2/mi-logo.png" value="V2/apps.png">
        </div>

        <!-- Método para el Archivo/Enlace de Descarga -->
        <div class="form-group">
          <label>Método para el Archivo o Link de Descarga:</label>
          <select id="fileMethod" onchange="cambiarMetodoArchivo()">
            <option value="v2">📁 Ruta local de la carpeta V2 (Ej: V2/archivo.pkg)</option>
            <option value="web">🌐 Enlace Web / URL externa (Ej: https://...)</option>
            <option value="desktop">💻 Subir archivo desde Escritorio</option>
          </select>
        </div>
        <div class="form-group" id="fileInputContainer">
          <input type="text" id="appFileValue" placeholder="Ej: V2/HEN.pkg o https://...">
        </div>

        <span id="statusApp" class="upload-status"></span>
        <button onclick="agregarItem()" style="background:#28a745; color:#fff; border:none; padding:11px; width:100%; border-radius:4px; font-weight:bold; cursor:pointer; font-size: 14px;">＋ Publicar Aplicación</button>
      </div>

      <!-- 2. PUBLICAR NOVEDAD -->
      <div class="admin-subpanel">
        <h3 style="margin-top:0; color:#00a2ff; font-size: 15px;">📢 2. Publicar Novedad o Noticia</h3>
        <div class="form-group">
          <label>Título de la Novedad:</label>
          <input type="text" id="newsTitleInput" placeholder="Ej: ¡Actualización HEN 4.93 disponible!">
        </div>
        <div class="form-group">
          <label>Imagen del Anuncio (Ruta V2 o URL web):</label>
          <input type="text" id="newsImgInput" placeholder="Ej: V2/banner.png o https://..." value="V2/banner.png">
        </div>
        <div class="form-group">
          <label>Descripción / Detalle del Anuncio:</label>
          <textarea id="newsDescInput" rows="3" placeholder="Escribe la información aquí..."></textarea>
        </div>
        <span id="statusNews" class="upload-status"></span>
        <button onclick="agregarNovedad()" style="background:#0070d1; color:#fff; border:none; padding:11px; width:100%; border-radius:4px; font-weight:bold; cursor:pointer; font-size: 14px;">📢 Publicar Novedad</button>
      </div>

      <!-- 3. MODERAR COMENTARIOS -->
      <div class="admin-subpanel">
        <h3 style="margin-top:0; color:#e67e22; font-size: 15px;">💬 3. Moderar Comentarios</h3>
        <div id="adminCommentsList"></div>
      </div>

      <!-- 4. ADMINISTRAR APLICACIONES -->
      <div class="admin-subpanel">
        <h3 style="margin-top:0; color:#ffc107; font-size: 15px;">🗑️ 4. Administrar Aplicaciones Publicadas</h3>
        <div id="adminAppsList"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    window.validarAcceso = async function() {
      let u = document.getElementById('userInput').value.trim();
      let p = document.getElementById('passInput').value.trim();
      if (u === "admin" && p === "1234") {
        document.getElementById('lockScreen').style.display = 'none';
        document.getElementById('adminContent').style.display = 'block';
        cargarListasAdminRealtime();
      } else {
        alert("Credenciales incorrectas.");
      }
    }

    // Cambiar input de logo dinámicamente según el select
    window.cambiarMetodoLogo = function() {
      let metodo = document.getElementById('logoMethod').value;
      let container = document.getElementById('logoInputContainer');
      if (metodo === 'desktop') {
        container.innerHTML = `<input type="file" id="appLogoFile" accept="image/*">`;
      } else {
        container.innerHTML = `<input type="text" id="appLogoValue" placeholder="Ej: V2/apps.png o https://..." value="V2/apps.png">`;
      }
    }

    // Cambiar input de archivo dinámicamente según el select
    window.cambiarMetodoArchivo = function() {
      let metodo = document.getElementById('fileMethod').value;
      let container = document.getElementById('fileInputContainer');
      if (metodo === 'desktop') {
        container.innerHTML = `<input type="file" id="appFileFile">`;
      } else {
        container.innerHTML = `<input type="text" id="appFileValue" placeholder="Ej: V2/archivo.pkg o https://...">`;
      }
    }

    window.agregarItem = async function() {
      let name = document.getElementById('appName').value.trim();
      let category = document.getElementById('appCategory').value;
      let statusEl = document.getElementById('statusApp');

      if (!name) { alert("Ingresa el nombre de la aplicación."); return; }

      statusEl.innerText = "Procesando...";

      try {
        // Obtener Logo
        let logoMethod = document.getElementById('logoMethod').value;
        let logoUrl = "V2/apps.png";
        if (logoMethod === 'desktop') {
          let logoFile = document.getElementById('appLogoFile').files[0];
          if (logoFile) {
            statusEl.innerText = "Subiendo logo a la nube...";
            const logoRef = window.ref(window.storage, 'logos/' + Date.now() + '_' + logoFile.name);
            await window.uploadBytes(logoRef, logoFile);
            logoUrl = await window.getDownloadURL(logoRef);
          }
        } else {
          let val = document.getElementById('appLogoValue').value.trim();
          if (val) logoUrl = val;
        }

        // Obtener Enlace o Archivo de Descarga
        let fileMethod = document.getElementById('fileMethod').value;
        let downloadUrl = "";
        if (fileMethod === 'desktop') {
          let fileFile = document.getElementById('appFileFile').files[0];
          if (fileFile) {
            statusEl.innerText = "Subiendo archivo principal a la nube...";
            const fileRef = window.ref(window.storage, 'archivos/' + Date.now() + '_' + fileFile.name);
            await window.uploadBytes(fileRef, fileFile);
            downloadUrl = await window.getDownloadURL(fileRef);
          } else {
            alert("Selecciona un archivo de tu escritorio para subir.");
            statusEl.innerText = "";
            return;
          }
        } else {
          downloadUrl = document.getElementById('appFileValue').value.trim();
          if (!downloadUrl) {
            alert("Ingresa la ruta V2 o el enlace web de descarga.");
            statusEl.innerText = "";
            return;
          }
        }

        await addDoc(window.colApps, {
          id: Date.now(),
          nombre: name,
          categoria: category,
          logo: logoUrl,
          enlace: downloadUrl
        });

        statusEl.innerText = "¡Publicado con éxito!";
        alert("¡Aplicación publicada correctamente!");
        document.getElementById('appName').value = '';
        setTimeout(() => statusEl.innerText = "", 3000);

      } catch (error) {
        console.error(error);
        alert("Error al publicar: " + error.message);
        statusEl.innerText = "";
      }
    }

    window.agregarNovedad = async function() {
      let title = document.getElementById('newsTitleInput').value.trim();
      let img = document.getElementById('newsImgInput').value.trim() || "V2/banner.png";
      let desc = document.getElementById('newsDescInput').value.trim();

      if (!title || !desc) { alert("Faltan datos en la novedad."); return; }

      await addDoc(window.colNews, {
        id: Date.now(),
        titulo: title,
        fecha: new Date().toLocaleDateString(),
        imagen: img,
        descripcion: desc
      });

      alert("Novedad publicada con éxito.");
      document.getElementById('newsTitleInput').value = '';
      document.getElementById('newsDescInput').value = '';
    }

    window.eliminarDocumento = async function(coleccion, idDoc) {
      if (confirm("¿Estás seguro de eliminar este elemento?")) {
        await deleteDoc(doc(window.db, coleccion, idDoc));
      }
    }

    function cargarListasAdminRealtime() {
      onSnapshot(window.colApps, (snapshot) => {
        let container = document.getElementById('adminAppsList');
        container.innerHTML = '';
        snapshot.forEach(docSnap => {
          let app = docSnap.data();
          container.innerHTML += `
            <div class="item-list-row">
              <span>[${app.categoria}] <strong>${app.nombre}</strong></span>
              <button class="btn-delete" onclick="eliminarDocumento('apps', '${docSnap.id}')">🗑️ Borrar</button>
            </div>`;
        });
      });

      onSnapshot(window.colComments, (snapshot) => {
        let container = document.getElementById('adminCommentsList');
        container.innerHTML = '';
        snapshot.forEach(docSnap => {
          let c = docSnap.data();
          container.innerHTML += `
            <div class="item-list-row">
              <span><strong>${c.usuario}</strong>: "${c.asunto}"</span>
              <button class="btn-delete" onclick="eliminarDocumento('comments', '${docSnap.id}')">🗑️ Borrar</button>
            </div>`;
        });
      });
    }
  </script>
</body>
</html>
