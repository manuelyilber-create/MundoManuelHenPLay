<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Privado Admin | MundoManuelHenPlay</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #0d0f12;
      color: #ffffff;
    }

    #lockScreen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #0d0f12;
    }

    .login-box {
      background: #1f232d;
      padding: 30px;
      border-radius: 8px;
      width: 320px;
      text-align: center;
      border: 2px solid #0070d1;
      box-shadow: 0 0 20px rgba(0, 112, 209, 0.4);
    }

    .login-box input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      box-sizing: border-box;
      background: #161920;
      border: 1px solid #3a4150;
      color: #fff;
      border-radius: 4px;
    }

    .login-box button {
      background: #0070d1;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }

    #adminContent {
      display: none;
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
    }

    #adminPanel {
      background: #252a36;
      padding: 20px;
      border-radius: 8px;
      border: 2px solid #0070d1;
    }

    .admin-subpanel {
      background: #1a1e27;
      padding: 15px;
      border-radius: 6px;
      margin-top: 15px;
      border: 1px dashed #00a2ff;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #00a2ff;
      font-size: 14px;
    }

    .form-group input[type="text"], 
    .form-group select, 
    .form-group textarea,
    .form-group input[type="file"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      background: #161920;
      border: 1px solid #3a4150;
      color: #fff;
      border-radius: 4px;
    }

    .sub-option-box {
      background: #12151c;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #2a2f3d;
      margin-top: 5px;
    }

    .item-list-row {
      background: #161920;
      padding: 10px;
      margin-top: 8px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 3px solid #0070d1;
    }

    .btn-delete {
      background: #dc3545;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-block {
      background: #ff9800;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 5px;
    }
  </style>
</head>
<body>

  <div id="lockScreen">
    <div class="login-box">
      <h3 style="margin-top:0; color:#00a2ff;">🔒 Acceso Exclusivo Admin</h3>
      <input type="text" id="userInput" placeholder="Usuario">
      <input type="password" id="passInput" placeholder="Contraseña">
      <button onclick="validarAcceso()">Ingresar al Panel</button>
    </div>
  </div>

  <div id="adminContent">
    <div id="adminPanel">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3a4150; padding-bottom: 10px;">
        <h3 style="margin: 0; color: #00a2ff;">Panel Privado de Control General</h3>
        <div>
          <a href="index.html" style="background:#0070d1; color:#fff; text-decoration:none; padding:6px 12px; border-radius:4px; margin-right:8px; font-size:14px;">🌐 Ver Sitio Web</a>
          <button onclick="cerrarSesion()" style="background:#dc3545; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">🚪 Salir</button>
        </div>
      </div>

      <div class="admin-subpanel">
        <h4 style="margin-top:0; color:#28a745;">📦 1. Agregar Nueva Aplicación / Archivo</h4>
        
        <div class="form-group">
          <label>Nombre y Versión:</label>
          <input type="text" id="appName" placeholder="Ej: HEN 4.93 Installer v1.0">
        </div>

        <div class="form-group">
          <label>Categoría:</label>
          <select id="appCategory">
            <option value="PS2">PS2</option>
            <option value="PS3">PS3</option>
            <option value="PS4">PS4</option>
            <option value="Aplicaciones">Aplicaciones</option>
            <option value="Utilidades">Utilidades</option>
            <option value="Android">Android</option>
          </select>
        </div>

        <div class="form-group">
          <label>Método para el Logo/Imagen:</label>
          <select id="logoMethod" onchange="cambiarMetodoLogo()">
            <option value="v2">📁 Ruta local de la carpeta V2 (Ej: V2/apps.png)</option>
            <option value="url">🌐 Enlace Web / URL externa (Ej: https://...)</option>
            <option value="file">💻 Subir archivo desde Escritorio</option>
          </select>
          
          <div class="sub-option-box">
            <div id="optV2">
              <input type="text" id="appLogoV2" placeholder="Ej: V2/apps.png o V2/mi-logo.png">
            </div>
            <div id="optUrl" style="display:none;">
              <input type="text" id="appLogoUrl" placeholder="Ej: https://sitio.com/imagen.png">
            </div>
            <div id="optFile" style="display:none;">
              <input type="file" id="appLogoFile" accept="image/*">
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>Ruta o Link de Descarga (URL/Servidor local):</label>
          <input type="text" id="appLink" placeholder="Ej: Ps3/Hen/4.93/SETUP.P3T o https://...">
        </div>

        <button onclick="agregarItem()" style="background:#28a745; color:#fff; border:none; padding:10px; width:100%; border-radius:4px; font-weight:bold; cursor:pointer;">＋ Publicar Aplicación</button>
      </div>

      <div class="admin-subpanel">
        <h4 style="margin-top:0; color:#00a2ff;">📢 2. Publicar Novedad o Noticia</h4>
        <div class="form-group">
          <label>Título de la Novedad:</label>
          <input type="text" id="newsTitleInput" placeholder="Ej: ¡Actualización HEN 4.93 disponible!">
        </div>
        <div class="form-group">
          <label>Imagen del Anuncio (Ruta V2 o URL web):</label>
          <input type="text" id="newsImgInput" placeholder="Ej: V2/banner.png o https://...">
        </div>
        <div class="form-group">
          <label>Descripción / Detalle del Anuncio:</label>
          <textarea id="newsDescInput" rows="3" placeholder="Escribe la información aquí..."></textarea>
        </div>
        <button onclick="agregarNovedad()" style="background:#0070d1; color:#fff; border:none; padding:10px; width:100%; border-radius:4px; font-weight:bold; cursor:pointer;">📢 Publicar Novedad</button>
      </div>

      <div class="admin-subpanel">
        <h4 style="margin-top:0; color:#e67e22;">💬 3. Moderar Comentarios del Chat</h4>
        <div id="adminCommentsList"></div>
      </div>

      <div class="admin-subpanel">
        <h4 style="margin-top:0; color:#e74c3c;">🚫 4. Usuarios Bloqueados</h4>
        <div id="adminBlockedList"></div>
      </div>

      <div class="admin-subpanel">
        <h4 style="margin-top:0; color:#ffc107;">🗑️ 5. Administrar Aplicaciones Publicadas</h4>
        <div id="adminAppsList"></div>
      </div>

      <div class="admin-subpanel">
        <h4 style="margin-top:0; color:#ffc107;">🗑️ 6. Administrar Noticias Publicadas</h4>
        <div id="adminNewsList"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCv-qeex1pBV7pfi2UD0iUio46-OX2MCiI",
      authDomain: "mundomanuelhenplay.firebaseapp.com",
      projectId: "mundomanuelhenplay",
      storageBucket: "mundomanuelhenplay.firebasestorage.app",
      messagingSenderId: "1072751644369",
      appId: "1:1072751644369:web:9ce6b8ad4b115b2e643ff0",
      measurementId: "G-QZ4RSWGEJL"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.colApps = collection(db, "apps");
    window.colNews = collection(db, "news");
    window.colComments = collection(db, "comments");
    window.colBlocked = collection(db, "blocked_users");

    window.AdminFirestoreFns = { addDoc, deleteDoc, doc, setDoc, onSnapshot, collection };
  </script>

  <script>
    let listaAplicaciones = [];
    let listaNoticias = [];
    let listaComentarios = [];
    let listaUsuariosBloqueados = [];

    async function calcularSHA256(texto) {
      const encoder = new TextEncoder();
      const data = encoder.encode(texto);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function validarAcceso() {
      let u = document.getElementById('userInput').value.trim();
      let p = document.getElementById('passInput').value.trim();

      const hashGuardado = "03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4"; // Contraseña: 1234
      let hashIngresado = await calcularSHA256(p);

      if (u === "admin" && hashIngresado === hashGuardado) {
        document.getElementById('lockScreen').style.display = 'none';
        document.getElementById('adminContent').style.display = 'block';
        iniciarEscuchasAdmin();
      } else {
        alert("Credenciales incorrectas.");
      }
    }

    function iniciarEscuchasAdmin() {
      const { onSnapshot } = window.AdminFirestoreFns;

      onSnapshot(window.colApps, (snapshot) => {
        listaAplicaciones = snapshot.docs.map(doc => ({ firebaseId: doc.id, ...doc.data() }));
        cargarListasAdmin();
      });

      onSnapshot(window.colNews, (snapshot) => {
        listaNoticias = snapshot.docs.map(doc => ({ firebaseId: doc.id, ...doc.data() }));
        cargarListasAdmin();
      });

      onSnapshot(window.colComments, (snapshot) => {
        listaComentarios = snapshot.docs.map(doc => ({ firebaseId: doc.id, ...doc.data() }));
        cargarListasAdmin();
      });

      onSnapshot(window.colBlocked, (snapshot) => {
        listaUsuariosBloqueados = snapshot.docs.map(doc => ({ firebaseId: doc.id, ...doc.data() }));
        cargarListasAdmin();
      });
    }

    function cerrarSesion() { location.reload(); }

    function cambiarMetodoLogo() {
      let metodo = document.getElementById('logoMethod').value;
      document.getElementById('optV2').style.display = (metodo === 'v2') ? 'block' : 'none';
      document.getElementById('optUrl').style.display = (metodo === 'url') ? 'block' : 'none';
      document.getElementById('optFile').style.display = (metodo === 'file') ? 'block' : 'none';
    }

    function leerArchivoComoDataURL(fileInput) {
      return new Promise((resolve, reject) => {
        const file = fileInput.files[0];
        if (!file) { resolve(null); return; }
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = (error) => reject(error);
        reader.readAsDataURL(file);
      });
    }

    async function agregarItem() {
      let name = document.getElementById('appName').value.trim();
      let category = document.getElementById('appCategory').value;
      let link = document.getElementById('appLink').value.trim();
      let metodo = document.getElementById('logoMethod').value;
      let logoFinal = 'V2/apps.png';

      if (!name || !link) { alert("Ingresa el Nombre y el Enlace/URL de descarga."); return; }

      if (metodo === 'v2') {
        let v2Val = document.getElementById('appLogoV2').value.trim();
        if (v2Val) logoFinal = v2Val;
      } else if (metodo === 'url') {
        let urlVal = document.getElementById('appLogoUrl').value.trim();
        if (urlVal) logoFinal = urlVal;
      } else if (metodo === 'file') {
        let fileInput = document.getElementById('appLogoFile');
        let fileData = await leerArchivoComoDataURL(fileInput);
        if (fileData) logoFinal = fileData;
      }

      const { addDoc } = window.AdminFirestoreFns;
      try {
        await addDoc(window.colApps, { id: Date.now(), nombre: name, categoria: category, logo: logoFinal, enlace: link });
        document.getElementById('appName').value = '';
        document.getElementById('appLink').value = '';
        alert("Aplicación publicada con éxito en la nube.");
      } catch(e) { alert("Error: " + e.message); }
    }

    async function agregarNovedad() {
      let title = document.getElementById('newsTitleInput').value.trim();
      let img = document.getElementById('newsImgInput').value.trim() || 'V2/banner.png';
      let desc = document.getElementById('newsDescInput').value.trim();

      if(title && desc) {
        const { addDoc } = window.AdminFirestoreFns;
        try {
          await addDoc(window.colNews, { id: Date.now(), titulo: title, fecha: new Date().toLocaleDateString(), imagen: img, descripcion: desc });
          document.getElementById('newsTitleInput').value = '';
          document.getElementById('newsImgInput').value = '';
          document.getElementById('newsDescInput').value = '';
          alert("Novedad publicada con éxito en la nube.");
        } catch(e) { alert("Error: " + e.message); }
      }
    }

    async function eliminarComentario(firebaseId) {
      const { deleteDoc, doc } = window.AdminFirestoreFns;
      try {
        await deleteDoc(doc(window.db, "comments", firebaseId));
      } catch(e) { console.error(e); }
    }

    async function bloquearUsuario(nombreUsuario) {
      let partes = nombreUsuario.split(" ");
      let nombre = partes[0] || "";
      let apellido = partes.slice(1).join(" ") || "";

      let existe = listaUsuariosBloqueados.some(u => u.nombre.toLowerCase() === nombre.toLowerCase() && u.apellido.toLowerCase() === apellido.toLowerCase());
      if (!existe) {
        const { addDoc } = window.AdminFirestoreFns;
        try {
          await addDoc(window.colBlocked, { nombre: nombre, apellido: apellido });
          alert("Usuario " + nombreUsuario + " bloqueado.");
        } catch(e) { console.error(e); }
      }
    }

    async function desbloquearUsuario(firebaseId) {
      const { deleteDoc, doc } = window.AdminFirestoreFns;
      try {
        await deleteDoc(doc(window.db, "blocked_users", firebaseId));
      } catch(e) { console.error(e); }
    }

    async function eliminarItem(firebaseId) {
      const { deleteDoc, doc } = window.AdminFirestoreFns;
      try {
        await deleteDoc(doc(window.db, "apps", firebaseId));
      } catch(e) { console.error(e); }
    }

    async function eliminarNovedad(firebaseId) {
      const { deleteDoc, doc } = window.AdminFirestoreFns;
      try {
        await deleteDoc(doc(window.db, "news", firebaseId));
      } catch(e) { console.error(e); }
    }

    function cargarListasAdmin() {
      let comContainer = document.getElementById('adminCommentsList');
      comContainer.innerHTML = '';
      if(listaComentarios.length === 0) comContainer.innerHTML = '<small style="color:#aaa;">No hay comentarios registrados.</small>';
      listaComentarios.forEach(c => {
        comContainer.innerHTML += `
          <div class="item-list-row">
            <span><strong>${c.usuario}</strong>: "${c.asunto}" - ${c.mensaje}</span>
            <div>
              <button class="btn-block" onclick="bloquearUsuario('${c.usuario}')">🚫 Bloquear Usuario</button>
              <button class="btn-delete" onclick="eliminarComentario('${c.firebaseId}')">🗑️ Borrar</button>
            </div>
          </div>`;
      });

      let blockedContainer = document.getElementById('adminBlockedList');
      blockedContainer.innerHTML = '';
      if(listaUsuariosBloqueados.length === 0) blockedContainer.innerHTML = '<small style="color:#aaa;">No hay usuarios bloqueados.</small>';
      listaUsuariosBloqueados.forEach((u) => {
        blockedContainer.innerHTML += `
          <div class="item-list-row">
            <span>🚫 <strong>${u.nombre} ${u.apellido}</strong></span>
            <button class="btn-delete" style="background:#28a745;" onclick="desbloquearUsuario('${u.firebaseId}')">🔓 Desbloquear</button>
          </div>`;
      });

      let appContainer = document.getElementById('adminAppsList');
      appContainer.innerHTML = '';
      if(listaAplicaciones.length === 0) appContainer.innerHTML = '<small style="color:#aaa;">No hay aplicaciones.</small>';
      listaAplicaciones.forEach(app => {
        appContainer.innerHTML += `
          <div class="item-list-row">
            <span>[${app.categoria}] <strong>${app.nombre}</strong></span>
            <button class="btn-delete" onclick="eliminarItem('${app.firebaseId}')">🗑️ Borrar</button>
          </div>`;
      });

      let newsContainer = document.getElementById('adminNewsList');
      newsContainer.innerHTML = '';
      if(listaNoticias.length === 0) newsContainer.innerHTML = '<small style="color:#aaa;">No hay novedades.</small>';
      listaNoticias.forEach(n => {
        newsContainer.innerHTML += `
          <div class="item-list-row">
            <span><strong>${n.titulo}</strong> (${n.fecha})</span>
            <button class="btn-delete" onclick="eliminarNovedad('${n.firebaseId}')">🗑️ Borrar</button>
          </div>`;
      });
    }
  </script>
</body>
</html>
