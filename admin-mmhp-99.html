<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Privado Admin | MundoManuelHenPlay</title>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCv-qeex1pBV7pfi2UD0iUio46-OX2MCiI",
      authDomain: "mundomanuelhenplay.firebaseapp.com",
      projectId: "mundomanuelhenplay",
      storageBucket: "mundomanuelhenplay.firebasestorage.app",
      messagingSenderId: "1072751644369",
      appId: "1:1072751644369:web:9ce6b8ad4b115b2e643ff0",
      measurementId: "G-QZ4RSWGEJL"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    window.db = db;
    window.storage = storage;
    window.ref = ref;
    window.uploadBytes = uploadBytes;
    window.getDownloadURL = getDownloadURL;
    window.colApps = collection(db, "apps");
    window.colNews = collection(db, "news");
    window.colComments = collection(db, "comments");
  </script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; font-family: Arial, sans-serif; background: #0d0f12; color: #ffffff; }
    #lockScreen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; padding: 15px; }
    .login-box { background: #1f232d; padding: 25px; border-radius: 8px; width: 100%; max-width: 320px; text-align: center; border: 2px solid #0070d1; }
    .login-box input { width: 100%; padding: 10px; margin-bottom: 12px; background: #161920; border: 1px solid #3a4150; color: #fff; border-radius: 4px; }
    .login-box button { background: #0070d1; color: #fff; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; }
    #adminContent { display: none; max-width: 1000px; margin: 15px auto; padding: 15px; }
    #adminPanel { background: #252a36; padding: 15px; border-radius: 8px; border: 2px solid #0070d1; }
    .admin-subpanel { background: #1a1e27; padding: 12px; border-radius: 6px; margin-top: 15px; border: 1px dashed #00a2ff; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 5px; color: #00a2ff; font-size: 13px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; background: #161920; border: 1px solid #3a4150; color: #fff; border-radius: 4px; }
    .item-list-row { background: #161920; padding: 10px; margin-top: 8px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid #0070d1; flex-wrap: wrap; gap: 10px; }
    .btn-delete { background: #dc3545; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    .upload-status { font-size: 12px; color: #f1c40f; margin-top: 4px; display: block; }
  </style>
</head>
<body>

  <div id="lockScreen">
    <div class="login-box">
      <h3 style="margin-top:0; color:#00a2ff;">🔒 Acceso Admin Cloud</h3>
      <input type="text" id="userInput" placeholder="Usuario">
      <input type="password" id="passInput" placeholder="Contraseña">
      <button onclick="validarAcceso()">Ingresar al Panel</button>
    </div>
  </div>

  <div id="adminContent">
    <div id="adminPanel">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3a4150; padding-bottom: 10px;">
        <h3 style="margin: 0; color: #00a2ff;">Panel de Administración Cloud</h3>
        <a href="index.html" style="background:#0070d1; color:#fff; text-decoration:none; padding:6px 12px; border-radius:4px; font-size:13px;">🌐 Sitio Web</a>
      </div>

      <div class="admin-subpanel">
        <h4 style="margin-top:0; color:#28a745;">📦 1. Agregar Aplicación / Archivo</h4>
        <div class="form-group"><label>Nombre:</label><input type="text" id="appName" placeholder="Ej: HEN 4.93"></div>
        <div class="form-group">
          <label>Categoría:</label>
          <select id="appCategory">
            <option value="PS2">PS2</option><option value="PS3">PS3</option><option value="PS4">PS4</option>
            <option value="Aplicaciones">Aplicaciones</option><option value="Utilidades">Utilidades</option><option value="Android">Android</option>
          </select>
        </div>
        
        <div class="form-group">
          <label>Logo (Elige una opción):</label>
          <input type="file" id="appLogoFile" accept="image/*" style="margin-bottom:6px;">
          <input type="text" id="appLogoUrl" placeholder="O pega URL de imagen (Ej: V2/apps.png)">
        </div>

        <div class="form-group">
          <label>Archivo o Enlace de Descarga (Elige una opción):</label>
          <input type="file" id="appFile" style="margin-bottom:6px;">
          <input type="text" id="appLinkText" placeholder="O pega un Enlace Externo (https://...)">
        </div>

        <span id="statusApp" class="upload-status"></span>
        <button onclick="agregarItem()" style="background:#28a745; color:#fff; border:none; padding:10px; width:100%; border-radius:4px; font-weight:bold; cursor:pointer;">＋ Publicar en la Nube</button>
      </div>

      <div class="admin-subpanel">
        <h4 style="margin-top:0; color:#00a2ff;">📢 2. Publicar Novedad</h4>
        <div class="form-group"><input type="text" id="newsTitleInput" placeholder="Título..."></div>
        <div class="form-group">
          <label>Imagen de Novedad (Elige una opción):</label>
          <input type="file" id="newsImgFile" accept="image/*" style="margin-bottom:6px;">
          <input type="text" id="newsImgUrl" placeholder="O pega URL de imagen (Ej: V2/banner.png)">
        </div>
        <div class="form-group"><textarea id="newsDescInput" rows="2" placeholder="Descripción..."></textarea></div>
        <span id="statusNews" class="upload-status"></span>
        <button onclick="agregarNovedad()" style="background:#0070d1; color:#fff; border:none; padding:10px; width:100%; border-radius:4px; font-weight:bold; cursor:pointer;">Publicar Novedad</button>
      </div>

      <div class="admin-subpanel">
        <h4 style="margin-top:0; color:#e67e22;">💬 3. Moderar Comentarios</h4>
        <div id="adminCommentsList"></div>
      </div>

      <div class="admin-subpanel">
        <h4 style="margin-top:0; color:#ffc107;">🗑️ 4. Administrar Aplicaciones</h4>
        <div id="adminAppsList"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    window.validarAcceso = async function() {
      let u = document.getElementById('userInput').value.trim();
      let p = document.getElementById('passInput').value.trim();
      if (u === "admin" && p === "1234") {
        document.getElementById('lockScreen').style.display = 'none';
        document.getElementById('adminContent').style.display = 'block';
        cargarListasAdminRealtime();
      } else {
        alert("Credenciales incorrectas.");
      }
    }

    window.agregarItem = async function() {
      let name = document.getElementById('appName').value.trim();
      let category = document.getElementById('appCategory').value;
      
      let linkText = document.getElementById('appLinkText').value.trim();
      let fileInput = document.getElementById('appFile').files[0];
      
      let logoUrlInput = document.getElementById('appLogoUrl').value.trim();
      let logoInput = document.getElementById('appLogoFile').files[0];
      
      let statusEl = document.getElementById('statusApp');

      if (!name) { alert("Ingresa al menos el nombre de la aplicación."); return; }

      let downloadUrl = linkText;
      let logoUrl = logoUrlInput ? logoUrlInput : "V2/apps.png";

      statusEl.innerText = "Procesando...";

      try {
        if (fileInput) {
          statusEl.innerText = "Subiendo archivo desde escritorio...";
          const fileRef = window.ref(window.storage, 'archivos/' + Date.now() + '_' + fileInput.name);
          await window.uploadBytes(fileRef, fileInput);
          downloadUrl = await window.getDownloadURL(fileRef);
        }

        if (logoInput) {
          statusEl.innerText = "Subiendo logo desde escritorio...";
          const logoRef = window.ref(window.storage, 'logos/' + Date.now() + '_' + logoInput.name);
          await window.uploadBytes(logoRef, logoInput);
          logoUrl = await window.getDownloadURL(logoRef);
        }

        if (!downloadUrl) {
          alert("Debes subir un archivo o colocar un enlace de descarga.");
          statusEl.innerText = "";
          return;
        }

        await addDoc(window.colApps, {
          id: Date.now(),
          nombre: name,
          categoria: category,
          logo: logoUrl,
          enlace: downloadUrl
        });

        statusEl.innerText = "¡Publicado con éxito!";
        alert("¡Aplicación publicada correctamente!");
        
        document.getElementById('appName').value = '';
        document.getElementById('appLinkText').value = '';
        document.getElementById('appFile').value = '';
        document.getElementById('appLogoUrl').value = '';
        document.getElementById('appLogoFile').value = '';
        setTimeout(() => statusEl.innerText = "", 3000);

      } catch (error) {
        console.error(error);
        alert("Error al subir: " + error.message);
        statusEl.innerText = "";
      }
    }

    window.agregarNovedad = async function() {
      let title = document.getElementById('newsTitleInput').value.trim();
      let desc = document.getElementById('newsDescInput').value.trim();
      
      let imgUrlInput = document.getElementById('newsImgUrl').value.trim();
      let imgInput = document.getElementById('newsImgFile').files[0];
      
      let statusEl = document.getElementById('statusNews');

      if (!title || !desc) { alert("Faltan datos en la novedad."); return; }

      let imgUrl = imgUrlInput ? imgUrlInput : "V2/banner.png";
      statusEl.innerText = "Procesando novedad...";

      try {
        if (imgInput) {
          statusEl.innerText = "Subiendo imagen de novedad...";
          const imgRef = window.ref(window.storage, 'novedades/' + Date.now() + '_' + imgInput.name);
          await window.uploadBytes(imgRef, imgInput);
          imgUrl = await window.getDownloadURL(imgRef);
        }

        await addDoc(window.colNews, {
          id: Date.now(),
          titulo: title,
          fecha: new Date().toLocaleDateString(),
          imagen: imgUrl,
          descripcion: desc
        });

        statusEl.innerText = "¡Novedad publicada!";
        alert("Novedad publicada con éxito.");
        
        document.getElementById('newsTitleInput').value = '';
        document.getElementById('newsDescInput').value = '';
        document.getElementById('newsImgUrl').value = '';
        document.getElementById('newsImgFile').value = '';
        setTimeout(() => statusEl.innerText = "", 3000);

      } catch (error) {
        console.error(error);
        alert("Error al publicar novedad: " + error.message);
        statusEl.innerText = "";
      }
    }

    window.eliminarDocumento = async function(coleccion, idDoc) {
      await deleteDoc(doc(window.db, coleccion, idDoc));
    }

    function cargarListasAdminRealtime() {
      onSnapshot(window.colApps, (snapshot) => {
        let container = document.getElementById('adminAppsList');
        container.innerHTML = '';
        snapshot.forEach(docSnap => {
          let app = docSnap.data();
          container.innerHTML += `
            <div class="item-list-row">
              <span>[${app.categoria}] <strong>${app.nombre}</strong></span>
              <button class="btn-delete" onclick="eliminarDocumento('apps', '${docSnap.id}')">🗑️ Borrar</button>
            </div>`;
        });
      });

      onSnapshot(window.colComments, (snapshot) => {
        let container = document.getElementById('adminCommentsList');
        container.innerHTML = '';
        snapshot.forEach(docSnap => {
          let c = docSnap.data();
          container.innerHTML += `
            <div class="item-list-row">
              <span><strong>${c.usuario}</strong>: "${c.asunto}"</span>
              <button class="btn-delete" onclick="eliminarDocumento('comments', '${docSnap.id}')">🗑️ Borrar</button>
            </div>`;
        });
      });
    }
  </script>
</body>
</html>
